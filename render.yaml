databases:
  - name: ha-sar-reviewer-db
    plan: basic-256mb
    diskSizeGB: 1
    region: singapore
    databaseName: ha_sar
    user: ha_sar_app
    ipAllowList: []

services:
  - type: web
    name: ha-sar-reviewer
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: ha-sar-reviewer-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_NAME
        value: HA-SAR-Results
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAX_FILE_MB
        value: 15
      - key: RESULT_TTL_DAYS
        value: 7
      - key: POLL_INTERVAL_SECONDS
        value: 30
      - key: DELIVERY_RETRY_SECONDS
        value: 300
